<style id="estilosGrimorioAstral">
  /* ---------- pill de navegación (mismo look que btn-extra) ---------- */

  /* ---------- tabs (Estrategias / Builds) ---------- */
  .grimorio-tabs{ display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap; }
  .grimorio-tab-btn{
    background:var(--bg-2); color:var(--gray);
    border:1px solid var(--line);
    padding:10px 18px;
    font-family:'Space Mono', monospace; font-size:0.76rem; letter-spacing:0.04em; text-transform:uppercase;
    cursor:pointer;
    transition:border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .grimorio-tab-btn:hover{ color:var(--white); border-color:rgba(255,91,31,0.4); }
  .grimorio-tab-btn.activo{ background:var(--orange-dim); color:var(--orange-bright); border-color:rgba(255,91,31,0.5); }

  /* ---------- barra de filtros + publicar ---------- */
  .grimorio-barra{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:16px; flex-wrap:wrap; margin-bottom:22px;
  }
  .grimorio-filtros{ display:flex; gap:10px; flex-wrap:wrap; }
  .grimorio-select{
    background:var(--bg-2); border:1px solid var(--line); color:var(--white);
    padding:8px 10px; font-family:'Manrope', sans-serif; font-size:0.82rem;
    min-width:150px;
  }
  .grimorio-select:focus{ outline:none; border-color:var(--orange); }

  /* ---------- grilla de publicaciones ---------- */
  .grimorio-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:16px;
  }
  .grimorio-card{ cursor:pointer; padding:0; overflow:hidden; display:flex; flex-direction:column; }
  .grimorio-card-img{ width:100%; aspect-ratio:16/9; object-fit:cover; display:block; border-bottom:1px solid var(--line); background:var(--bg-2); }
  .grimorio-card-body{ padding:16px 18px 14px; display:flex; flex-direction:column; flex:1; }
  .grimorio-card-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .grimorio-tag{
    font-family:'Space Mono', monospace; font-size:0.64rem; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--orange-bright); border:1px solid rgba(255,91,31,0.35); background:var(--orange-dim);
    padding:3px 8px;
  }
  .grimorio-card h3{ font-size:1.05rem; margin-bottom:8px; color:var(--white); font-family:'Manrope',sans-serif; font-weight:800; }
  .grimorio-card-extracto{ color:var(--gray); font-size:0.86rem; margin-bottom:14px; flex:1;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .grimorio-card-autor{ display:flex; align-items:center; gap:8px; margin-top:auto; }
  .grimorio-mini-avatar{ width:20px; height:20px; border-radius:50%; object-fit:cover; border:1px solid var(--line); background:var(--bg-2); flex-shrink:0; }
  .grimorio-mini-avatar.vacio{ display:flex; align-items:center; justify-content:center; font-size:0.6rem; color:var(--gray-dim); }
  .grimorio-card-autor span{ font-family:'Space Mono', monospace; font-size:0.72rem; color:var(--gray); }
  .grimorio-card-foot{
    display:flex; align-items:center; justify-content:space-between;
    font-family:'Space Mono', monospace; font-size:0.68rem; color:var(--gray-dim);
    border-top:1px dashed rgba(246,243,236,0.14); margin-top:12px; padding-top:10px;
  }
  .grimorio-card-foot .comentarios-count{ display:flex; align-items:center; gap:4px; }
  .grimorio-card-foot svg{ width:12px; height:12px; }

  /* ---------- estado vacío ---------- */
  .grimorio-vacio{
    grid-column:1 / -1;
    border:1px dashed var(--line);
    padding:48px 24px;
    text-align:center;
    color:var(--gray);
  }
  .grimorio-vacio svg{ width:34px; height:34px; color:var(--orange); margin-bottom:14px; }
  .grimorio-vacio p{ font-size:0.92rem; max-width:40ch; margin:8px auto 18px; }

  /* ---------- modal de detalle (más ancho que el estándar) ---------- */
  .modal-box-grimorio{ max-width:620px; max-height:88vh; overflow-y:auto; }
  .grimorio-detalle-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .grimorio-detalle-autor{ display:flex; align-items:center; gap:10px; margin:4px 0 16px; }
  .grimorio-detalle-autor span{ font-family:'Space Mono', monospace; font-size:0.76rem; color:var(--gray); }
  .grimorio-detalle-img{ width:100%; max-height:360px; object-fit:cover; margin-bottom:16px; border:1px solid var(--line); }
  .grimorio-detalle-texto{ color:var(--white); font-size:0.94rem; line-height:1.65; white-space:pre-wrap; margin-bottom:18px; }

  .grimorio-video-embed iframe{ position:absolute; inset:0; width:100%; height:100%; border:none; }
  .grimorio-detalle-acciones{ display:flex; justify-content:flex-end; gap:16px; margin-bottom:8px; }
  .grimorio-link-accion{
    background:none; border:none; cursor:pointer; padding:0;
    font-family:'Space Mono', monospace; font-size:0.72rem; color:var(--gray-dim);
    text-decoration:underline; text-underline-offset:3px;
  }
  .grimorio-link-accion:hover{ color:var(--orange-bright); }
  .grimorio-link-accion.peligro:hover{ color:#ff6b6b; }
  .grimorio-link-accion[disabled]{ cursor:default; text-decoration:none; opacity:0.6; }

  /* ---------- comentarios ---------- */
  .grimorio-comentarios-head{ border-top:1px solid var(--line); padding-top:16px; margin-top:4px; }
  .grimorio-comentarios-head h4{ font-family:'Manrope',sans-serif; font-size:0.9rem; color:var(--white); margin-bottom:12px; }
  .grimorio-comentarios-lista{ display:flex; flex-direction:column; gap:12px; margin-bottom:16px; max-height:260px; overflow-y:auto; }
  .grimorio-comentario{ display:flex; gap:10px; }
  .grimorio-comentario-cuerpo{ flex:1; background:var(--bg-2); border:1px solid var(--line); padding:9px 12px; }
  .grimorio-comentario-cabecera{ display:flex; justify-content:space-between; gap:8px; margin-bottom:3px; }
  .grimorio-comentario-nombre{ font-family:'Space Mono', monospace; font-size:0.72rem; color:var(--orange-bright); }
  .grimorio-comentario-fecha{ font-family:'Space Mono', monospace; font-size:0.64rem; color:var(--gray-dim); }
  .grimorio-comentario-texto{ font-size:0.84rem; color:var(--white); line-height:1.45; white-space:pre-wrap; }
  .grimorio-comentario-vacio{ color:var(--gray-dim); font-size:0.82rem; }
  .grimorio-comentar-fila{ display:flex; gap:8px; align-items:flex-start; }
  .grimorio-comentar-fila textarea{ flex:1; min-height:44px; resize:vertical; }
  .grimorio-comentar-fila .btn-primary{ padding:10px 16px; font-size:0.78rem; white-space:nowrap; }

  #grimorioLoginBotones[hidden],
  .grimorio-comentar-fila[hidden]{ display:none !important; }

    .grimorio-comentar-fila{ flex-direction:column; }
    .grimorio-comentar-fila .btn-primary{ align-self:flex-end; }

  const dic = GRIMORIO_T[idiomaActual] || GRIMORIO_T.es;

}

function grimorioFormatearFecha(iso) {
  const ahora = Date.now();
  const t = new Date(iso).getTime();
  const diffSeg = Math.max(0, Math.floor((ahora - t) / 1000));
  if (diffSeg < 90) return gt("haceRecien");
  const diffMin = Math.floor(diffSeg / 60);
  if (diffMin < 60) return gt("haceMin", diffMin);
  const diffHoras = Math.floor(diffMin / 60);
  if (diffHoras < 24) return gt("haceHoras", diffHoras);
  const diffDias = Math.floor(diffHoras / 24);
  return gt("haceDias", diffDias);
}

function grimorioEmbedVideo(url) {
  if (!url) return "";
  try {
    const u = new URL(url);
    let src = null;
    if (/(^|\.)youtube\.com$/.test(u.hostname) && u.searchParams.get("v")) {
      src = `https://www.youtube.com/embed/${u.searchParams.get("v")}`;
    } else if (u.hostname === "youtu.be") {
      src = `https://www.youtube.com/embed/${u.pathname.replace("/", "")}`;
    } else if (/(^|\.)youtube\.com$/.test(u.hostname) && (u.pathname.startsWith("/embed/") || u.pathname.startsWith("/shorts/"))) {
      src = `https://www.youtube.com/embed/${u.pathname.split("/").pop()}`;
    } else if (/(^|\.)clips\.twitch\.tv$/.test(u.hostname)) {
      const clipId = u.pathname.replace("/", "");
      src = `https://clips.twitch.tv/embed?clip=${clipId}&parent=${window.location.hostname}`;
    } else if (/(^|\.)twitch\.tv$/.test(u.hostname) && u.pathname.startsWith("/videos/")) {
      const videoId = u.pathname.split("/").pop();
      src = `https://player.twitch.tv/?video=${videoId}&parent=${window.location.hostname}`;
    }
    if (src) {
      return `<div class="grimorio-video-embed"><iframe src="${src}" allowfullscreen loading="lazy"></iframe></div>`;
    }
  } catch (e) { /* url inválida, cae al link de abajo */ }
  return `<p style="margin-bottom:16px;"><a href="${escaparHtml(url)}" target="_blank" rel="noopener" style="color:var(--orange-bright);">▶ ${escaparHtml(url)}</a></p>`;
}

/* ---------- carga + render del feed ---------- */
async function grimorioCargarFeed() {
  const grid = document.getElementById("grimorioGrid");
  if (!grid) return;
  if (!sbClient) {
    grid.innerHTML = `<div class="grimorio-vacio"><p>${gt("supabaseNoConfigurado")}</p></div>`;
    return;
  }
  grimorioState.cargando = true;
  let query = sbClient.from("grimorio_feed").select("*").eq("categoria", grimorioState.tab).limit(60);
  const { data, error } = await query;
  grimorioState.cargando = false;
  if (error) {
    grid.innerHTML = `<div class="grimorio-vacio"><p>${gt("errorGenerico")}</p></div>`;
    return;
  }
  grimorioState.cache[grimorioState.tab] = data || [];
  grimorioRenderFeed();
}

function grimorioRenderFeed() {
  const grid = document.getElementById("grimorioGrid");
  if (!grid) return;
  let items = grimorioState.cache[grimorioState.tab] || [];

  if (grimorioState.filtroClase) items = items.filter(p => p.clase === grimorioState.filtroClase);
  if (grimorioState.tab === "estrategia") {
    if (grimorioState.filtroTipo) items = items.filter(p => p.tipo_estrategia === grimorioState.filtroTipo);
    if (grimorioState.filtroDungeon) {
      const q = grimorioState.filtroDungeon.toLowerCase();
      items = items.filter(p => (p.dungeon || "").toLowerCase().includes(q));
    }
  } else {
    if (grimorioState.filtroEnfoque) items = items.filter(p => p.enfoque === grimorioState.filtroEnfoque);
  }

  if (!items.length) {
    const titulo = grimorioState.tab === "estrategia" ? gt("vacioEstrategiasTitulo") : gt("vacioBuildsTitulo");
    const desc = grimorioState.tab === "estrategia" ? gt("vacioEstrategiasDesc") : gt("vacioBuildsDesc");
    grid.innerHTML = `<div class="grimorio-vacio">${GRIMORIO_ICONOS.vacio}<h3 style="color:var(--white); font-family:'Manrope',sans-serif;">${titulo}</h3><p>${desc}</p></div>`;
    return;
  }

  grid.innerHTML = items.map(grimorioCardHtml).join("");
  grid.querySelectorAll(".grimorio-card").forEach(card => {
    card.addEventListener("click", () => grimorioAbrirDetalle(card.dataset.id));
  });
}

function grimorioCardHtml(pub) {
  const imgUrl = grimorioUrlImagen(pub.imagen_path);
  const tagClase = `<span class="grimorio-tag">${escaparHtml(pub.clase)}</span>`;
  const dic = gtDic();
  const tagExtra = pub.categoria === "estrategia"
    ? (pub.tipo_estrategia ? `<span class="grimorio-tag">${dic.tipoEstrategiaOpciones[pub.tipo_estrategia] || pub.tipo_estrategia}</span>` : "")
    : (pub.enfoque ? `<span class="grimorio-tag">${dic.enfoqueOpciones[pub.enfoque] || pub.enfoque}</span>` : "");
  const subtitulo = pub.categoria === "estrategia" ? escaparHtml(pub.dungeon || "") : escaparHtml(pub.nivel_rango || "");
  return `
    <div class="card grimorio-card" data-id="${pub.id}">
      ${imgUrl ? `<img class="grimorio-card-img" src="${imgUrl}" alt="" loading="lazy">` : ""}
      <div class="grimorio-card-body">
        <div class="grimorio-card-tags">${tagClase}${tagExtra}</div>
        <h3>${escaparHtml(pub.titulo)}</h3>
        ${subtitulo ? `<p class="servidor-tag" style="margin:-4px 0 8px;">${subtitulo}</p>` : ""}
        <p class="grimorio-card-extracto">${escaparHtml(pub.texto)}</p>
        <div class="grimorio-card-autor">${grimorioAvatarHtml(pub.autor_avatar_id, pub.autor_nombre)}<span>${escaparHtml(pub.autor_nombre || gt("autorDesconocido"))}</span></div>
        <div class="grimorio-card-foot">
          <span>${grimorioFormatearFecha(pub.created_at)}</span>
          <span class="comentarios-count">${GRIMORIO_ICONOS.comentario}${gt("comentarios", pub.comentarios_count || 0)}</span>
        </div>
      </div>
    </div>
  `;
}

  document.getElementById("grimorioInputTitulo").value = "";
  document.getElementById("grimorioInputClase").value = "";
  document.getElementById("grimorioInputDungeon").value = "";
  document.getElementById("grimorioInputTipoEstrategia").value = "";
  document.getElementById("grimorioInputEnfoque").value = "";
  document.getElementById("grimorioInputNivelRango").value = "";
  document.getElementById("grimorioInputTexto").value = "";
  document.getElementById("grimorioInputImagen").value = "";
  document.getElementById("grimorioImagenNombre").hidden = true;
  document.getElementById("grimorioInputVideo").value = "";
  document.getElementById("grimorioPubError").hidden = true;
  document.getElementById("grimorioPubOk").hidden = true;

  const { data: { user } } = await sbClient.auth.getUser();
  const camposWrap = document.getElementById("grimorioCamposWrap");
  const loginAviso = document.getElementById("grimorioLoginAviso");
  const loginBotones = document.getElementById("grimorioLoginBotones");
  const btnConfirmar = document.getElementById("grimorioPubConfirmar");
  if (user) {
    camposWrap.hidden = false;
    loginAviso.hidden = true;
    loginBotones.hidden = true;
    btnConfirmar.hidden = false;
  } else {
    camposWrap.hidden = true;
    loginAviso.hidden = false;
    loginBotones.hidden = false;
    btnConfirmar.hidden = true;
  }
  modal.style.display = "flex";
}

function grimorioCerrarModalPublicar() {
  document.getElementById("modalGrimorioPublicar").style.display = "none";
}

function grimorioWireModalPublicar() {
  const modal = document.getElementById("modalGrimorioPublicar");
  modal.addEventListener("click", (e) => { if (e.target === modal) grimorioCerrarModalPublicar(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.style.display === "flex") grimorioCerrarModalPublicar();
  });
  document.getElementById("grimorioPubCancelar").addEventListener("click", grimorioCerrarModalPublicar);
  document.getElementById("grimorioLoginDiscord").addEventListener("click", () => {
    sbClient.auth.signInWithOAuth({ provider: "discord", options: { redirectTo: window.location.href } });
  });
  document.getElementById("grimorioLoginGoogle").addEventListener("click", () => {
    sbClient.auth.signInWithOAuth({ provider: "google", options: { redirectTo: window.location.href } });
  });

  const inputImagen = document.getElementById("grimorioInputImagen");
  const MAX_IMG_BYTES = 3 * 1024 * 1024;
  const TIPOS_PERMITIDOS = ["image/png", "image/jpeg"];
  inputImagen.addEventListener("change", () => {
    const errorEl = document.getElementById("grimorioPubError");
    const nombreEl = document.getElementById("grimorioImagenNombre");
    const archivo = inputImagen.files[0];
    errorEl.hidden = true;
    if (!archivo) { nombreEl.hidden = true; return; }
    if (!TIPOS_PERMITIDOS.includes(archivo.type)) {
      errorEl.textContent = gt("errorImagenTipo"); errorEl.hidden = false;
      inputImagen.value = ""; nombreEl.hidden = true; return;
    }
    if (archivo.size > MAX_IMG_BYTES) {
      errorEl.textContent = gt("errorImagenTamano"); errorEl.hidden = false;
      inputImagen.value = ""; nombreEl.hidden = true; return;
    }
    nombreEl.textContent = archivo.name;
    nombreEl.hidden = false;
  });

  document.getElementById("grimorioPubConfirmar").addEventListener("click", grimorioEnviarPublicacion);
}

async function grimorioEnviarPublicacion() {
  const errorEl = document.getElementById("grimorioPubError");
  const okEl = document.getElementById("grimorioPubOk");
  errorEl.hidden = true; okEl.hidden = true;

  const titulo = document.getElementById("grimorioInputTitulo").value.trim();
  const clase = document.getElementById("grimorioInputClase").value;
  const texto = document.getElementById("grimorioInputTexto").value.trim();
  const dungeon = document.getElementById("grimorioInputDungeon").value.trim();
  const tipoEstrategia = document.getElementById("grimorioInputTipoEstrategia").value;
  const enfoque = document.getElementById("grimorioInputEnfoque").value;
  const nivelRango = document.getElementById("grimorioInputNivelRango").value.trim();
  const videoUrl = document.getElementById("grimorioInputVideo").value.trim();

  if (!titulo) { errorEl.textContent = gt("errorSinTitulo"); errorEl.hidden = false; return; }
  if (!clase) { errorEl.textContent = gt("errorSinClase"); errorEl.hidden = false; return; }
  if (grimorioCategoriaModal === "estrategia" && !dungeon) { errorEl.textContent = gt("errorSinDungeon"); errorEl.hidden = false; return; }
  if (grimorioCategoriaModal === "build" && !enfoque) { errorEl.textContent = gt("errorSinEnfoque"); errorEl.hidden = false; return; }
  if (texto.length < 30) { errorEl.textContent = gt("errorTextoCorto"); errorEl.hidden = false; return; }

  const { data: { user } } = await sbClient.auth.getUser();
  if (!user) { errorEl.textContent = gt("avisoLogin"); errorEl.hidden = false; return; }

  const btnConfirmar = document.getElementById("grimorioPubConfirmar");
  btnConfirmar.disabled = true;
  btnConfirmar.textContent = gt("btnPublicando");

  let imagenPath = null;
  const archivo = document.getElementById("grimorioInputImagen").files[0];
  if (archivo) {
    const extension = archivo.type === "image/png" ? "png" : "jpg";
    const ruta = `${user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${extension}`;
    const { error: errSubida } = await sbClient.storage.from("grimorio-imagenes").upload(ruta, archivo, { contentType: archivo.type, upsert: false });
    if (errSubida) {
      errorEl.textContent = gt("errorGenerico"); errorEl.hidden = false;
      btnConfirmar.disabled = false; btnConfirmar.textContent = gt("btnPublicar");
      return;
    }
    imagenPath = ruta;
  }

  const payload = {
    user_id: user.id,
    categoria: grimorioCategoriaModal,
    clase,
    titulo,
    texto,
    imagen_path: imagenPath,
    video_url: videoUrl || null,
    dungeon: grimorioCategoriaModal === "estrategia" ? dungeon : null,
    tipo_estrategia: grimorioCategoriaModal === "estrategia" ? (tipoEstrategia || null) : null,
    enfoque: grimorioCategoriaModal === "build" ? enfoque : null,
    nivel_rango: grimorioCategoriaModal === "build" ? (nivelRango || null) : null
  };

  const { error } = await sbClient.from("grimorio_publicaciones").insert(payload);
  btnConfirmar.disabled = false;
  btnConfirmar.textContent = gt("btnPublicar");

  if (error) {
    errorEl.textContent = error.message && error.message.includes("Esper")
      ? error.message
      : (error.message && error.message.includes("límite") ? error.message : gt("errorGenerico"));
    errorEl.hidden = false;
    return;
  }

  okEl.textContent = gt("okPublicado");
  okEl.hidden = false;
  grimorioState.tab = grimorioCategoriaModal;
  setTimeout(() => {
    grimorioCerrarModalPublicar();
    initGrimorioAstral();
  }, 900);
}

/* ---------- modal: detalle + comentarios ---------- */
let grimorioPubAbierta = null;

async function grimorioAbrirDetalle(id) {
  const lista = grimorioState.cache[grimorioState.tab] || [];
  const pub = lista.find(p => String(p.id) === String(id));
  if (!pub) return;
  grimorioPubAbierta = pub;

  const box = document.getElementById("grimorioDetalleBox");
  const dic = gtDic();
  const tagClase = `<span class="grimorio-tag">${escaparHtml(pub.clase)}</span>`;
  const tagExtra = pub.categoria === "estrategia"
    ? (pub.tipo_estrategia ? `<span class="grimorio-tag">${dic.tipoEstrategiaOpciones[pub.tipo_estrategia] || pub.tipo_estrategia}</span>` : "")
    : (pub.enfoque ? `<span class="grimorio-tag">${dic.enfoqueOpciones[pub.enfoque] || pub.enfoque}</span>` : "");
  const subtitulo = pub.categoria === "estrategia" ? pub.dungeon : pub.nivel_rango;
  const imgUrl = grimorioUrlImagen(pub.imagen_path);

  const { data: { user } } = sbClient ? await sbClient.auth.getUser() : { data: { user: null } };
  const esAutor = user && user.id === pub.user_id;

  box.innerHTML = `
    <div class="grimorio-detalle-tags">${tagClase}${tagExtra}</div>
    <h3 style="font-size:1.4rem; margin-bottom:6px; font-family:'Manrope',sans-serif; font-weight:800;">${escaparHtml(pub.titulo)}</h3>
    ${subtitulo ? `<p class="servidor-tag" style="margin-bottom:10px;">${escaparHtml(subtitulo)}</p>` : ""}
    <div class="grimorio-detalle-autor">${grimorioAvatarHtml(pub.autor_avatar_id, pub.autor_nombre)}<span>${escaparHtml(pub.autor_nombre || gt("autorDesconocido"))} · ${grimorioFormatearFecha(pub.created_at)}</span></div>
    ${imgUrl ? `<img class="grimorio-detalle-img" src="${imgUrl}" alt="">` : ""}
    <p class="grimorio-detalle-texto">${escaparHtml(pub.texto)}</p>
    ${grimorioEmbedVideo(pub.video_url)}
    <div class="grimorio-detalle-acciones">
      ${esAutor
        ? `<button type="button" class="grimorio-link-accion peligro" id="grimorioBtnEliminarPub">${gt("btnEliminarPublicacion")}</button>`
        : `<button type="button" class="grimorio-link-accion" id="grimorioBtnReportar">${gt("btnReportar")}</button>`}
    </div>
    <div class="grimorio-comentarios-head">
      <h4></h4>
      <div class="grimorio-comentarios-lista" id="grimorioComentariosLista"><span class="grimorio-comentario-vacio">…</span></div>
      <div id="grimorioComentarLoginAviso" class="modal-aviso" style="margin-bottom:10px;" hidden></div>
      <div class="grimorio-comentar-fila" id="grimorioComentarFila" hidden>
        <textarea class="modal-input" id="grimorioInputComentario" maxlength="600" rows="1"></textarea>
        <button type="button" class="btn-primary" id="grimorioBtnComentar"></button>
      </div>
    </div>
  `;
  box.querySelector(".grimorio-comentarios-head h4").textContent = gt("comentarios", pub.comentarios_count || 0);
  document.getElementById("grimorioInputComentario").placeholder = gt("comentarPlaceholder");
  document.getElementById("grimorioBtnComentar").textContent = gt("btnComentar");

  if (esAutor) {
    document.getElementById("grimorioBtnEliminarPub").addEventListener("click", () => grimorioEliminarPublicacion(pub.id));
  } else {
    document.getElementById("grimorioBtnReportar").addEventListener("click", (e) => grimorioReportarPublicacion(pub.id, e.target));
  }

  if (user) {
    document.getElementById("grimorioComentarFila").hidden = false;
    document.getElementById("grimorioComentarLoginAviso").hidden = true;
    document.getElementById("grimorioBtnComentar").addEventListener("click", () => grimorioEnviarComentario(pub.id, user));
  } else {
    document.getElementById("grimorioComentarFila").hidden = true;
    const aviso = document.getElementById("grimorioComentarLoginAviso");
    aviso.hidden = false;
    aviso.textContent = gt("comentarAvisoLogin");
  }

  document.getElementById("modalGrimorioDetalle").style.display = "flex";
  grimorioCargarComentarios(pub.id, user);
}

async function grimorioCargarComentarios(publicacionId, user) {
  const lista = document.getElementById("grimorioComentariosLista");
  if (!sbClient) return;
  const { data, error } = await sbClient.from("grimorio_comentarios_feed").select("*").eq("publicacion_id", publicacionId);
  if (!lista) return;
  if (error || !data || !data.length) {
    lista.innerHTML = `<span class="grimorio-comentario-vacio">${gt("comentariosVacio")}</span>`;
    return;
  }
  lista.innerHTML = data.map(c => grimorioComentarioHtml(c, user)).join("");
  lista.querySelectorAll("[data-borrar-comentario]").forEach(btn => {
    btn.addEventListener("click", () => grimorioEliminarComentario(btn.dataset.borrarComentario, publicacionId, user));
  });
}

function grimorioComentarioHtml(c, user) {
  const esPropio = user && user.id === c.user_id;
  return `
    <div class="grimorio-comentario">
      ${grimorioAvatarHtml(c.autor_avatar_id, c.autor_nombre)}
      <div class="grimorio-comentario-cuerpo">
        <div class="grimorio-comentario-cabecera">
          <span class="grimorio-comentario-nombre">${escaparHtml(c.autor_nombre || gt("autorDesconocido"))}</span>
          <span class="grimorio-comentario-fecha">${grimorioFormatearFecha(c.created_at)}</span>
        </div>
        <div class="grimorio-comentario-texto">${escaparHtml(c.texto)}</div>
        ${esPropio ? `<button type="button" class="grimorio-link-accion peligro" style="margin-top:4px;" data-borrar-comentario="${c.id}">✕</button>` : ""}
      </div>
    </div>
  `;
}

async function grimorioEnviarComentario(publicacionId, user) {
  const input = document.getElementById("grimorioInputComentario");
  const btn = document.getElementById("grimorioBtnComentar");
  const texto = input.value.trim();
  if (!texto) return;
  btn.disabled = true;
  const { error } = await sbClient.from("grimorio_comentarios").insert({ publicacion_id: publicacionId, user_id: user.id, texto });
  btn.disabled = false;
  if (error) { alert(error.message || gt("errorGenerico")); return; }
  input.value = "";
  grimorioCargarComentarios(publicacionId, user);
  const pub = grimorioPubAbierta;
  if (pub) {
    pub.comentarios_count = (pub.comentarios_count || 0) + 1;
    document.querySelector(".grimorio-comentarios-head h4").textContent = gt("comentarios", pub.comentarios_count);
  }
}

async function grimorioEliminarComentario(comentarioId, publicacionId, user) {
  if (!confirm(gt("confirmarEliminarComentario"))) return;
  const { error } = await sbClient.from("grimorio_comentarios").delete().eq("id", comentarioId);
  if (error) { alert(error.message || gt("errorGenerico")); return; }
  grimorioCargarComentarios(publicacionId, user);
  const pub = grimorioPubAbierta;
  if (pub) {
    pub.comentarios_count = Math.max(0, (pub.comentarios_count || 1) - 1);
    document.querySelector(".grimorio-comentarios-head h4").textContent = gt("comentarios", pub.comentarios_count);
  }
}

async function grimorioReportarPublicacion(publicacionId, btnEl) {
  const { data: { user } } = await sbClient.auth.getUser();
  if (!user) { sbClient.auth.signInWithOAuth({ provider: "discord", options: { redirectTo: window.location.href } }); return; }
  btnEl.disabled = true;
  const { error } = await sbClient.from("grimorio_reportes").insert({ publicacion_id: publicacionId, user_id: user.id });
  if (!error || (error.message || "").includes("duplicate")) {
    btnEl.textContent = gt("reportado");
  } else {
    btnEl.disabled = false;
  }
}

async function grimorioEliminarPublicacion(publicacionId) {
  if (!confirm(gt("confirmarEliminar"))) return;
  const { error } = await sbClient.from("grimorio_publicaciones").delete().eq("id", publicacionId);
  if (error) { alert(error.message || gt("errorGenerico")); return; }
  document.getElementById("modalGrimorioDetalle").style.display = "none";
  grimorioCargarFeed();
}

function grimorioWireModalDetalle() {
  const modal = document.getElementById("modalGrimorioDetalle");
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.style.display === "flex") modal.style.display = "none";
  });
}

/* ---------- pill de nav + scrollspy propio ---------- */
function grimorioInitNavPill() {
  const pill = document.getElementById("grimorioNavChip");
  if (pill) pill.querySelector("span[data-g-nav]").textContent = gt("navGrimorio");
  const navLabel = document.getElementById("navGrimorioLabel");
  if (navLabel) navLabel.textContent = gt("navGrimorio");
  if (!("IntersectionObserver" in window)) return;
  const seccion = document.getElementById("grimorio-astral");
  const chip = document.getElementById("navChipGrimorio");
  if (!seccion || !chip) return;
  const obs = new IntersectionObserver((entradas) => {
    entradas.forEach(entrada => chip.classList.toggle("activo", entrada.isIntersecting));
  }, { rootMargin: "-35% 0px -55% 0px", threshold: 0 });
  obs.observe(seccion);
}

/* ---------- reactividad: idioma ---------- */
if (typeof aplicarIdioma === "function") {
  const _grimorioAplicarIdiomaOriginal = aplicarIdioma;
  aplicarIdioma = function (lang) {
    _grimorioAplicarIdiomaOriginal(lang);
    initGrimorioAstral();
    grimorioInitNavPill();
    const detalle = document.getElementById("modalGrimorioDetalle");
    if (detalle && detalle.style.display === "flex" && grimorioPubAbierta) {
      grimorioAbrirDetalle(grimorioPubAbierta.id);
    }
  };
}

/* ---------- arranque ---------- */
initGrimorioAstral();
grimorioInitNavPill();

</script>

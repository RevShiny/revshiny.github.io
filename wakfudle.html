<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wakfu-dle — Astra Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141312; --bg-2:#1c1a18; --panel:#211e1b;
    --orange:#ff5b1f; --orange-bright:#ff8a3d;
    --white:#f6f3ec; --gray:#9c968c; --gray-dim:#716c63;
    --line:#33302c;
  }
  *{ box-sizing:border-box; }
  body{
    background:var(--bg); color:var(--white);
    font-family:'Manrope', sans-serif;
    margin:0; padding:40px 20px 80px;
  }
  .wrap{ max-width:640px; margin:0 auto; }
  h1{
    font-family:'Anton', sans-serif;
    font-size:2.2rem; text-transform:uppercase;
    color:var(--white); margin-bottom:2px;
  }
  h1 span{ color:var(--orange); }
  .subt{ color:var(--gray); margin-bottom:26px; font-size:0.95rem; }

  .buscador{ position:relative; margin-bottom:20px; }
  #inputClase{
    width:100%; padding:14px 16px;
    background:var(--panel); border:1px solid var(--line);
    color:var(--white); font-family:'Manrope', sans-serif; font-size:1rem;
  }
  #inputClase:focus{ outline:none; border-color:var(--orange); }
  #listaSugerencias{
    position:absolute; top:calc(100% + 4px); left:0; right:0;
    background:var(--panel); border:1px solid var(--orange);
    max-height:220px; overflow-y:auto; z-index:20; display:none;
  }
  #listaSugerencias.abierta{ display:block; }
  .sugerencia{ padding:10px 16px; cursor:pointer; font-size:0.95rem; }
  .sugerencia:hover, .sugerencia.activa{ background:rgba(255,91,31,0.15); color:var(--orange-bright); }

  .cabecera-tabla{
    display:grid; grid-template-columns:0.6fr 1.4fr 1fr 0.8fr 1fr 0.6fr;
    gap:6px; margin-bottom:8px;
    font-family:'Space Mono', monospace; font-size:0.62rem;
    text-transform:uppercase; letter-spacing:0.03em; color:var(--gray-dim);
    text-align:center;
  }
  .cabecera-tabla span:nth-child(2){ text-align:left; }

  .fila-guess{
    display:grid; grid-template-columns:0.6fr 1.4fr 1fr 0.8fr 1fr 0.6fr;
    gap:6px; margin-bottom:6px;
  }
  .celda{
    padding:12px 8px; text-align:center;
    font-weight:700; font-size:0.85rem;
    border-radius:3px;
  }
  .celda.icono{ padding:6px; display:flex; align-items:center; justify-content:center; background:var(--panel); }
  .celda.icono img{ width:100%; max-width:56px; height:auto; border-radius:6px; }
  .celda.nombre{ text-align:left; font-family:'Anton', sans-serif; letter-spacing:0.02em; }
  .celda.correcto{ background:#3c8a4c; color:#fff; }
  .celda.parcial{ background:#b8922e; color:#fff; }
  .celda.incorrecto{ background:#3a3532; color:var(--gray); }
  .celda .flecha{ font-size:0.7rem; margin-left:3px; }

  #mensajeFinal{
    margin-top:24px; padding:18px; background:var(--panel);
    border:1px solid var(--orange); text-align:center; display:none;
  }
  #mensajeFinal.visible{ display:block; }
  #mensajeFinal h2{ font-family:'Anton', sans-serif; color:var(--orange-bright); margin:0 0 6px; }
  #btnReiniciar{
    margin-top:14px; padding:10px 22px; background:var(--orange); color:#0f0e0d;
    border:none; font-weight:800; text-transform:uppercase; cursor:pointer;
    clip-path:polygon(0 0, 100% 0, 96% 100%, 4% 100%);
  }
  #btnReiniciar:hover{ background:var(--orange-bright); }

  .volver{ display:inline-block; margin-bottom:24px; color:var(--gray); text-decoration:none; font-size:0.85rem; }
  .volver:hover{ color:var(--orange-bright); }

  .leyenda{ display:flex; gap:16px; flex-wrap:wrap; margin-top:20px; font-size:0.75rem; color:var(--gray-dim); }
  .leyenda span{ display:inline-flex; align-items:center; gap:5px; }
  .punto{ width:10px; height:10px; display:inline-block; border-radius:2px; }
  @media (max-width: 520px){
    .cabecera-tabla, .fila-guess{ gap:3px; }
    .celda{ padding:8px 3px; font-size:0.68rem; }
    .celda.icono img{ max-width:30px; }
    .cabecera-tabla{ font-size:0.5rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="volver" id="linkVolver" href="/">← Volver a Astra Club</a>
  <h1>WAKFU<span>-DLE</span></h1>
  <p class="subt" id="subtitulo">Adiviná la clase de Wakfu. Cada intento te da pistas — probá las 18.</p>

  <div class="buscador">
    <input type="text" id="inputClase" placeholder="Escribí el nombre de una clase..." autocomplete="off">
    <div id="listaSugerencias"></div>
  </div>

  <div class="cabecera-tabla">
    <span></span>
    <span id="hClase">Clase</span>
    <span id="hElemento">Elemento(s)</span>
    <span id="hDoce">De los 12</span>
    <span id="hHechizos">Hechizos</span>
    <span id="hInicial">Inicial</span>
  </div>
  <div id="filasGuesses"></div>

  <div id="mensajeFinal">
    <h2 id="mensajeFinalTitulo"></h2>
    <p id="mensajeFinalTexto"></p>
    <button id="btnReiniciar" type="button">Jugar de nuevo</button>
  </div>

  <div class="leyenda">
    <span><i class="punto" style="background:#3c8a4c;"></i> <span id="legCorrecto">Correcto</span></span>
    <span><i class="punto" style="background:#b8922e;"></i> <span id="legParcial">Parcial</span></span>
    <span><i class="punto" style="background:#3a3532;"></i> <span id="legIncorrecto">Incorrecto</span></span>
  </div>
</div>

<script>
const I18N = {
  es: {
    title: "Wakfu-dle — Astra Club",
    volver: "← Volver a Astra Club",
    subt: "Adiviná la clase de Wakfu. Cada intento te da pistas — probá las 18.",
    placeholder: "Escribí el nombre de una clase...",
    colClase: "Clase",
    colElemento: "Elemento(s)",
    colDoce: "De los 12",
    colHechizos: "Hechizos",
    colInicial: "Inicial",
    si: "Sí",
    no: "No",
    correcto: "Correcto",
    parcial: "Parcial",
    incorrecto: "Incorrecto",
    ganaste: "¡Lo lograste! 🎉",
    perdiste: "Se acabaron las clases",
    resultado: (nombre, intentos) => `La clase era ${nombre}. La adivinaste en ${intentos} intento${intentos === 1 ? "" : "s"}.`,
    reiniciar: "Jugar de nuevo",
    elementos: { Fuego:"Fuego", Agua:"Agua", Tierra:"Tierra", Aire:"Aire", Luz:"Luz" }
  },
  en: {
    title: "Wakfu-dle — Astra Club",
    volver: "← Back to Astra Club",
    subt: "Guess the Wakfu class. Each guess gives you clues — you've got 18 tries.",
    placeholder: "Type a class name...",
    colClase: "Class",
    colElemento: "Element(s)",
    colDoce: "One of the 12",
    colHechizos: "Spells",
    colInicial: "Initial",
    si: "Yes",
    no: "No",
    correcto: "Correct",
    parcial: "Partial",
    incorrecto: "Incorrect",
    ganaste: "You got it! 🎉",
    perdiste: "Out of classes",
    resultado: (nombre, intentos) => `The class was ${nombre}. You guessed it in ${intentos} ${intentos === 1 ? "try" : "tries"}.`,
    reiniciar: "Play again",
    elementos: { Fuego:"Fire", Agua:"Water", Tierra:"Earth", Aire:"Air", Luz:"Light" }
  },
  fr: {
    title: "Wakfu-dle — Astra Club",
    volver: "← Retour à Astra Club",
    subt: "Devine la classe de Wakfu. Chaque essai te donne des indices — tu as 18 essais.",
    placeholder: "Tape le nom d'une classe...",
    colClase: "Classe",
    colElemento: "Élément(s)",
    colDoce: "Une des 12",
    colHechizos: "Sorts",
    colInicial: "Initiale",
    si: "Oui",
    no: "Non",
    correcto: "Correct",
    parcial: "Partiel",
    incorrecto: "Incorrect",
    ganaste: "Tu as trouvé ! 🎉",
    perdiste: "Plus de classes",
    resultado: (nombre, intentos) => `La classe était ${nombre}. Tu l'as devinée en ${intentos} essai${intentos === 1 ? "" : "s"}.`,
    reiniciar: "Rejouer",
    elementos: { Fuego:"Feu", Agua:"Eau", Tierra:"Terre", Aire:"Air", Luz:"Lumière" }
  },
  pt: {
    title: "Wakfu-dle — Astra Club",
    volver: "← Voltar para o Astra Club",
    subt: "Adivinhe a classe de Wakfu. Cada tentativa te dá pistas — você tem 18 tentativas.",
    placeholder: "Digite o nome de uma classe...",
    colClase: "Classe",
    colElemento: "Elemento(s)",
    colDoce: "Uma das 12",
    colHechizos: "Feitiços",
    colInicial: "Inicial",
    si: "Sim",
    no: "Não",
    correcto: "Correto",
    parcial: "Parcial",
    incorrecto: "Incorreto",
    ganaste: "Você conseguiu! 🎉",
    perdiste: "Acabaram as classes",
    resultado: (nombre, intentos) => `A classe era ${nombre}. Você acertou em ${intentos} tentativa${intentos === 1 ? "" : "s"}.`,
    reiniciar: "Jogar de novo",
    elementos: { Fuego:"Fogo", Agua:"Água", Tierra:"Terra", Aire:"Ar", Luz:"Luz" }
  }
};

const LANG = (localStorage.getItem("astra_lang") || "es");
const T = I18N[LANG] || I18N.es;
document.documentElement.lang = I18N[LANG] ? LANG : "es";
document.title = T.title;

const CLASES = [
  { nombre: "Cra", img: "https://cdn.wakfuli.com/breeds/cra.webp", elementos: ["Fuego","Tierra","Aire","Luz"], doce: true, hechizos: 16 },
  { nombre: "Ecaflip", img: "https://cdn.wakfuli.com/breeds/ecaflip.webp", elementos: ["Fuego","Agua","Tierra"], doce: true, hechizos: 15 },
  { nombre: "Eliotrope", img: "https://cdn.wakfuli.com/breeds/eliotrope.webp", elementos: ["Agua","Tierra","Aire"], doce: false, hechizos: 15 },
  { nombre: "Eniripsa", img: "https://cdn.wakfuli.com/breeds/eniripsa.webp", elementos: ["Fuego","Agua","Aire"], doce: true, hechizos: 15 },
  { nombre: "Enutrof", img: "https://cdn.wakfuli.com/breeds/enutrof.webp", elementos: ["Fuego","Agua","Tierra"], doce: true, hechizos: 15 },
  { nombre: "Feca", img: "https://cdn.wakfuli.com/breeds/feca.webp", elementos: ["Fuego","Agua","Tierra"], doce: true, hechizos: 15 },
  { nombre: "Foggernaut", img: "https://cdn.wakfuli.com/breeds/steamer.webp", elementos: ["Fuego","Agua","Tierra"], doce: false, hechizos: 15 },
  { nombre: "Iop", img: "https://cdn.wakfuli.com/breeds/iop.webp", elementos: ["Fuego","Tierra","Aire"], doce: true, hechizos: 15 },
  { nombre: "Huppermage", img: "https://cdn.wakfuli.com/breeds/huppermage.webp", elementos: ["Fuego","Agua","Tierra","Aire"], doce: false, hechizos: 20 },
  { nombre: "Masqueraider", img: "https://cdn.wakfuli.com/breeds/zobal.webp", elementos: ["Fuego","Agua","Aire"], doce: false, hechizos: 15 },
  { nombre: "Osamodas", img: "https://cdn.wakfuli.com/breeds/osamodas.webp", elementos: ["Fuego","Tierra","Aire"], doce: true, hechizos: 15 },
  { nombre: "Ouginak", img: "https://cdn.wakfuli.com/breeds/ouginak.webp", elementos: ["Agua","Tierra","Aire"], doce: false, hechizos: 15 },
  { nombre: "Pandawa", img: "https://cdn.wakfuli.com/breeds/pandawa.webp", elementos: ["Fuego","Agua","Tierra"], doce: true, hechizos: 15 },
  { nombre: "Rogue", img: "https://cdn.wakfuli.com/breeds/roublard.webp", elementos: ["Fuego","Tierra","Aire"], doce: false, hechizos: 15 },
  { nombre: "Sacrier", img: "https://cdn.wakfuli.com/breeds/sacrieur.webp", elementos: ["Fuego","Tierra","Aire"], doce: true, hechizos: 15 },
  { nombre: "Sadida", img: "https://cdn.wakfuli.com/breeds/sadida.webp", elementos: ["Agua","Tierra","Aire"], doce: true, hechizos: 15 },
  { nombre: "Sram", img: "https://cdn.wakfuli.com/breeds/sram.webp", elementos: ["Fuego","Agua","Aire"], doce: true, hechizos: 15 },
  { nombre: "Xelor", img: "https://cdn.wakfuli.com/breeds/xelor.webp", elementos: ["Fuego","Agua","Aire"], doce: true, hechizos: 15 }
];

let claseSecreta = CLASES[Math.floor(Math.random() * CLASES.length)];
let intentosHechos = [];
let juegoTerminado = false;

const input = document.getElementById("inputClase");
const listaSugerencias = document.getElementById("listaSugerencias");
const filasGuesses = document.getElementById("filasGuesses");
const mensajeFinal = document.getElementById("mensajeFinal");

function aplicarTraducciones(){
  document.getElementById("linkVolver").textContent = T.volver;
  document.getElementById("subtitulo").textContent = T.subt;
  input.placeholder = T.placeholder;
  document.getElementById("hClase").textContent = T.colClase;
  document.getElementById("hElemento").textContent = T.colElemento;
  document.getElementById("hDoce").textContent = T.colDoce;
  document.getElementById("hHechizos").textContent = T.colHechizos;
  document.getElementById("hInicial").textContent = T.colInicial;
  document.getElementById("legCorrecto").textContent = T.correcto;
  document.getElementById("legParcial").textContent = T.parcial;
  document.getElementById("legIncorrecto").textContent = T.incorrecto;
  document.getElementById("btnReiniciar").textContent = T.reiniciar;
}
aplicarTraducciones();

input.addEventListener("input", () => {
  const texto = input.value.trim().toLowerCase();
  listaSugerencias.innerHTML = "";
  if(!texto){ listaSugerencias.classList.remove("abierta"); return; }

  const yaUsadas = intentosHechos.map(i => i.nombre);
  const coincidencias = CLASES.filter(c =>
    c.nombre.toLowerCase().includes(texto) && !yaUsadas.includes(c.nombre)
  );

  if(!coincidencias.length){ listaSugerencias.classList.remove("abierta"); return; }

  coincidencias.forEach(c => {
    const div = document.createElement("div");
    div.className = "sugerencia";
    div.textContent = c.nombre;
    div.addEventListener("click", () => intentar(c.nombre));
    listaSugerencias.appendChild(div);
  });
  listaSugerencias.classList.add("abierta");
});

input.addEventListener("keydown", (e) => {
  if(e.key === "Enter"){
    const primera = listaSugerencias.querySelector(".sugerencia");
    if(primera) intentar(primera.textContent);
  }
});

document.addEventListener("click", (e) => {
  if(!e.target.closest(".buscador")) listaSugerencias.classList.remove("abierta");
});

function intentar(nombreElegido){
  if(juegoTerminado) return;
  const clase = CLASES.find(c => c.nombre === nombreElegido);
  if(!clase) return;

  intentosHechos.push(clase);
  input.value = "";
  listaSugerencias.classList.remove("abierta");
  renderizarFila(clase);

  if(clase.nombre === claseSecreta.nombre){
    terminarJuego(true);
  }
}

function compararElementos(guess, secreta){
  const iguales = guess.length === secreta.length && guess.every(e => secreta.includes(e));
  if(iguales) return "correcto";
  const hayInterseccion = guess.some(e => secreta.includes(e));
  return hayInterseccion ? "parcial" : "incorrecto";
}

function traducirElementos(lista){
  return lista.map(e => T.elementos[e] || e).join(", ");
}

function renderizarFila(clase){
  const fila = document.createElement("div");
  fila.className = "fila-guess";

  const estadoElementos = compararElementos(clase.elementos, claseSecreta.elementos);
  const estadoDoce = clase.doce === claseSecreta.doce ? "correcto" : "incorrecto";
  const estadoHechizos = clase.hechizos === claseSecreta.hechizos ? "correcto" : "incorrecto";
  const inicialGuess = clase.nombre[0].toUpperCase();
  const inicialSecreta = claseSecreta.nombre[0].toUpperCase();
  const estadoInicial = inicialGuess === inicialSecreta ? "correcto" : "incorrecto";

  const flechaHechizos = clase.hechizos === claseSecreta.hechizos ? "" :
    (clase.hechizos < claseSecreta.hechizos ? '<span class="flecha">▲</span>' : '<span class="flecha">▼</span>');

  fila.innerHTML = `
    <div class="celda icono"><img src="${clase.img}" alt="${clase.nombre}" loading="lazy"></div>
    <div class="celda nombre">${clase.nombre}</div>
    <div class="celda ${estadoElementos}">${traducirElementos(clase.elementos)}</div>
    <div class="celda ${estadoDoce}">${clase.doce ? T.si : T.no}</div>
    <div class="celda ${estadoHechizos}">${clase.hechizos}${flechaHechizos}</div>
    <div class="celda ${estadoInicial}">${inicialGuess}</div>
  `;
  filasGuesses.prepend(fila);
}

function terminarJuego(gano){
  juegoTerminado = true;
  input.disabled = true;
  mensajeFinal.classList.add("visible");
  document.getElementById("mensajeFinalTitulo").textContent = gano ? T.ganaste : T.perdiste;
  document.getElementById("mensajeFinalTexto").textContent = T.resultado(claseSecreta.nombre, intentosHechos.length);
}

document.getElementById("btnReiniciar").addEventListener("click", () => {
  claseSecreta = CLASES[Math.floor(Math.random() * CLASES.length)];
  intentosHechos = [];
  juegoTerminado = false;
  input.disabled = false;
  filasGuesses.innerHTML = "";
  mensajeFinal.classList.remove("visible");
  input.focus();
});
</script>
</body>
</html>

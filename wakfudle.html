<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wakfu-dle — Astra Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141312; --bg-2:#1c1a18; --panel:#211e1b;
    --orange:#ff5b1f; --orange-bright:#ff8a3d;
    --white:#f6f3ec; --gray:#9c968c; --gray-dim:#716c63;
    --line:#33302c;
  }
  *{ box-sizing:border-box; }
  body{
    background:var(--bg); color:var(--white);
    font-family:'Manrope', sans-serif;
    margin:0; padding:40px 20px 80px;
  }
  .wrap{ max-width:640px; margin:0 auto; }
  h1{
    font-family:'Anton', sans-serif;
    font-size:2.2rem; text-transform:uppercase;
    color:var(--white); margin-bottom:2px;
  }
  h1 span{ color:var(--orange); }
  .subt{ color:var(--gray); margin-bottom:26px; font-size:0.95rem; }

  .buscador{ position:relative; margin-bottom:20px; }
  .buscador input{
    width:100%; padding:14px 16px;
    background:var(--panel); border:1px solid var(--line);
    color:var(--white); font-family:'Manrope', sans-serif; font-size:1rem;
  }
  .buscador input:focus{ outline:none; border-color:var(--orange); }
  .buscador input:disabled{ opacity:.5; }
  .lista-sugerencias{
    position:absolute; top:calc(100% + 4px); left:0; right:0;
    background:var(--panel); border:1px solid var(--orange);
    max-height:220px; overflow-y:auto; z-index:20; display:none;
  }
  .lista-sugerencias.abierta{ display:block; }
  .sugerencia{ padding:10px 16px; cursor:pointer; font-size:0.95rem; }
  .sugerencia:hover, .sugerencia.activa{ background:rgba(255,91,31,0.15); color:var(--orange-bright); }

  .cabecera-tabla{
    display:grid; grid-template-columns:0.6fr 1.4fr 1fr 0.8fr 1fr 0.6fr;
    gap:6px; margin-bottom:8px;
    font-family:'Space Mono', monospace; font-size:0.62rem;
    text-transform:uppercase; letter-spacing:0.03em; color:var(--gray-dim);
    text-align:center;
  }
  .cabecera-tabla span:nth-child(2){ text-align:left; }

  .fila-guess{
    display:grid; grid-template-columns:0.6fr 1.4fr 1fr 0.8fr 1fr 0.6fr;
    gap:6px; margin-bottom:6px;
  }
  .celda{
    padding:12px 8px; text-align:center;
    font-weight:700; font-size:0.85rem;
    border-radius:3px;
  }
  .celda.icono{ padding:6px; display:flex; align-items:center; justify-content:center; background:var(--panel); }
  .celda.icono img{ width:100%; max-width:56px; height:auto; border-radius:6px; }
  .celda.nombre{ text-align:left; font-family:'Anton', sans-serif; letter-spacing:0.02em; }
  .celda.correcto{ background:#3c8a4c; color:#fff; }
  .celda.parcial{ background:#b8922e; color:#fff; }
  .celda.incorrecto{ background:#3a3532; color:var(--gray); }
  .celda .flecha{ font-size:0.7rem; margin-left:3px; }

  #mensajeFinal{
    margin-top:24px; padding:18px; background:var(--panel);
    border:1px solid var(--orange); text-align:center; display:none;
  }
  #mensajeFinal.visible{ display:block; }
  #mensajeFinal h2{ font-family:'Anton', sans-serif; color:var(--orange-bright); margin:0 0 6px; }
  #btnReiniciar{
    margin-top:14px; padding:10px 22px; background:var(--orange); color:#0f0e0d;
    border:none; font-weight:800; text-transform:uppercase; cursor:pointer;
    clip-path:polygon(0 0, 100% 0, 96% 100%, 4% 100%);
  }
  #btnReiniciar:hover{ background:var(--orange-bright); }

  .volver{ display:inline-block; margin-bottom:24px; color:var(--gray); text-decoration:none; font-size:0.85rem; }
  .volver:hover{ color:var(--orange-bright); }

  .leyenda{ display:flex; gap:16px; flex-wrap:wrap; margin-top:20px; font-size:0.75rem; color:var(--gray-dim); }
  .leyenda span{ display:inline-flex; align-items:center; gap:5px; }
  .punto{ width:10px; height:10px; display:inline-block; border-radius:2px; }
  @media (max-width: 520px){
    .cabecera-tabla, .fila-guess{ gap:3px; }
    .celda{ padding:8px 3px; font-size:0.68rem; }
    .celda.icono img{ max-width:30px; }
    .cabecera-tabla{ font-size:0.5rem; }
  }

  /* --- Menú de modos --- */
  .grid-modos{ display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-top:6px; }
  .modo-card{
    background:var(--panel); border:2px solid var(--line); border-radius:10px;
    padding:16px; text-align:left; color:var(--white); cursor:pointer;
    font-family:'Manrope', sans-serif; transition:border-color .15s, transform .15s;
  }
  .modo-card:hover{ border-color:var(--orange); transform:translateY(-2px); }
  .modo-card strong{
    display:block; font-family:'Anton', sans-serif; letter-spacing:.02em;
    font-size:1.05rem; color:var(--orange-bright); margin-bottom:4px; text-transform:uppercase;
  }
  .modo-card p{ margin:0; font-size:.8rem; color:var(--gray); line-height:1.35; }
  .modo-card .badge{
    display:inline-block; margin-top:10px; font-size:.6rem; letter-spacing:.05em;
    text-transform:uppercase; color:var(--gray-dim); border:1px solid var(--line);
    border-radius:3px; padding:2px 6px;
  }
  .modo-card.proximamente{ opacity:.45; cursor:not-allowed; }
  .modo-card.proximamente:hover{ border-color:var(--line); transform:none; }
  @media (max-width: 480px){ .grid-modos{ grid-template-columns:1fr; } }

  .volver-menu{
    background:none; border:none; color:var(--gray); font-size:.85rem;
    cursor:pointer; padding:0; margin-bottom:18px; font-family:'Manrope', sans-serif;
  }
  .volver-menu:hover{ color:var(--orange-bright); }

  /* --- Modos de imagen (Silueta / Emblema) --- */
  .marco-imagen{
    width:220px; height:220px; margin:0 auto 22px; border-radius:16px;
    overflow:hidden; display:flex; align-items:center; justify-content:center;
    position:relative; background:linear-gradient(160deg, var(--orange-bright), var(--orange));
  }
  .marco-imagen img{ width:100%; height:100%; object-fit:cover; transition:filter .4s ease, transform .4s ease; }
  .marco-imagen canvas{ width:100%; height:100%; display:none; }
  .marco-imagen.silueta img{ filter:brightness(0); object-fit:contain; padding:14px; }
  .marco-imagen.silueta.revelado img{ filter:none; }
  .marco-imagen.emblema{ border-radius:50%; width:190px; height:190px; background:var(--panel); border:4px solid var(--orange); }
  .marco-imagen.emblema img{ display:none; object-position:center 15%; transform:scale(1.9); }
  .marco-imagen.emblema canvas{ display:block; }
  .marco-imagen.emblema.revelado img{ display:block; object-fit:contain; object-position:center; transform:none; padding:10px; }
  .marco-imagen.emblema.revelado canvas{ display:none; }

  .chips-intentos{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:6px 0 4px; min-height:28px; }
  .chip-intento{
    background:var(--panel); border:1px solid var(--line); color:var(--gray);
    padding:6px 10px; border-radius:4px; font-size:.78rem; font-weight:700;
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="volver" id="linkVolver" href="/">← Volver a Astra Club</a>

  <!-- ===== MENÚ DE MODOS ===== -->
  <div id="vistaMenu">
    <h1>WAKFU<span>-DLE</span></h1>
    <p class="subt" id="menuSubt">Elegí un modo de juego</p>
    <div class="grid-modos" id="gridModos"></div>
  </div>

  <!-- ===== VISTA DE JUEGO ===== -->
  <div id="vistaJuego" hidden>
    <button type="button" class="volver-menu" id="btnVolverMenu">← Volver al menú</button>
    <h1 id="tituloModo" style="font-size:1.6rem;"></h1>
    <p class="subt" id="subtModo"></p>

    <!-- UI Clásico (tabla de pistas) -->
    <div id="uiClasico" hidden>
      <div class="buscador">
        <input type="text" id="inputClase" placeholder="Escribí el nombre de una clase..." autocomplete="off">
        <div id="listaSugerencias" class="lista-sugerencias"></div>
      </div>
      <div class="cabecera-tabla">
        <span></span>
        <span id="hClase">Clase</span>
        <span id="hElemento">Elemento(s)</span>
        <span id="hDoce">De los 12</span>
        <span id="hHechizos">Hechizos</span>
        <span id="hInicial">Inicial</span>
      </div>
      <div id="filasGuesses"></div>
      <div class="leyenda">
        <span><i class="punto" style="background:#3c8a4c;"></i> <span id="legCorrecto">Correcto</span></span>
        <span><i class="punto" style="background:#b8922e;"></i> <span id="legParcial">Parcial</span></span>
        <span><i class="punto" style="background:#3a3532;"></i> <span id="legIncorrecto">Incorrecto</span></span>
      </div>
    </div>

    <!-- UI Silueta / Emblema (imagen a adivinar) -->
    <div id="uiImagen" hidden>
      <div id="marcoImagen" class="marco-imagen">
        <img id="imgSecreta" src="" alt="???">
        <canvas id="canvasEmblema" width="320" height="320"></canvas>
      </div>
      <div class="buscador">
        <input type="text" id="inputImagen" placeholder="Escribí el nombre de una clase..." autocomplete="off">
        <div id="listaSugerenciasImagen" class="lista-sugerencias"></div>
      </div>
      <div id="chipsIntentos" class="chips-intentos"></div>
    </div>

    <div id="mensajeFinal">
      <h2 id="mensajeFinalTitulo"></h2>
      <p id="mensajeFinalTexto"></p>
      <button id="btnReiniciar" type="button">Jugar de nuevo</button>
    </div>
  </div>
</div>

// Devuelve la imagen a usar según el modo: tanto Silueta como Emblema usan
// el arte oficial completo (elegido al azar entre las variantes
// disponibles) y caen al ícono pequeño si a esa clase todavía no le
// cargamos arte propio.
function getImagenModo(clase, modoId){
  if((modoId === "silueta" || modoId === "emblema") && clase.siluetas && clase.siluetas.length){
    return clase.siluetas[Math.floor(Math.random() * clase.siluetas.length)];
  }
  return clase.img;
}

// Config de modos. "disponible:false" = tarjeta deshabilitada, "Próximamente".
const MODOS = [
  { id:"clasico",   disponible:true,  tipo:"clasico" },
  { id:"silueta",   disponible:true,  tipo:"imagen"  },
  { id:"emblema",   disponible:true,  tipo:"imagen"  },
  { id:"habilidad", disponible:false, tipo:"imagen"  },
  { id:"arma",      disponible:false, tipo:"imagen"  },
  { id:"splash",    disponible:false, tipo:"imagen"  },
  { id:"frases",    disponible:false, tipo:"imagen"  }
];

const estado = { modo:null, claseSecreta:null, intentos:[], terminado:false };

// --- Referencias DOM ---
const vistaMenu = document.getElementById("vistaMenu");
const vistaJuego = document.getElementById("vistaJuego");
const gridModos = document.getElementById("gridModos");
const btnVolverMenu = document.getElementById("btnVolverMenu");
const tituloModo = document.getElementById("tituloModo");
const subtModo = document.getElementById("subtModo");

const uiClasico = document.getElementById("uiClasico");
const input = document.getElementById("inputClase");
const listaSugerencias = document.getElementById("listaSugerencias");
const filasGuesses = document.getElementById("filasGuesses");

const uiImagen = document.getElementById("uiImagen");
const inputImagen = document.getElementById("inputImagen");
const listaSugerenciasImagen = document.getElementById("listaSugerenciasImagen");
const marcoImagen = document.getElementById("marcoImagen");
const imgSecreta = document.getElementById("imgSecreta");
const canvasEmblema = document.getElementById("canvasEmblema");
const ctxEmblema = canvasEmblema.getContext("2d");
const chipsIntentos = document.getElementById("chipsIntentos");

// --- Modo Emblema: revelado progresivo por pixelado ---
// Cada clase equivocada "despixela" un poco más la imagen (más bloques,
// menos desenfoque) y el recorte queda bien acercado, mostrando torso y
// no solo la cara, para que haya más superficie de la que agarrarse.
const cacheImagenesEmblema = {};
function cargarImagenEmblema(src){
  if(cacheImagenesEmblema[src]) return Promise.resolve(cacheImagenesEmblema[src]);
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => { cacheImagenesEmblema[src] = im; resolve(im); };
    im.onerror = reject;
    im.src = src;
  });
}

function dibujarEmblema(src, intentos){
  cargarImagenEmblema(src).then(im => {
    const w = im.naturalWidth, h = im.naturalHeight;
    // Recorte acercado y centrado un poco hacia arriba (torso/pecho),
    // no solo la cara — así hay más pistas de color/forma para adivinar.
    const recorte = Math.min(w, h) * 0.6;
    const rx = (w - recorte) / 2;
    const ry = Math.max(0, Math.min(h - recorte, h * 0.1));

    const bloques = Math.min(4 + Math.floor(intentos * 2.4), 46);
    const tmp = document.createElement("canvas");
    tmp.width = bloques;
    tmp.height = bloques;
    tmp.getContext("2d").drawImage(im, rx, ry, recorte, recorte, 0, 0, bloques, bloques);

    const N = canvasEmblema.width;
    ctxEmblema.clearRect(0, 0, N, N);
    ctxEmblema.imageSmoothingEnabled = false;
    const desenfoque = Math.max(0, 2.6 - intentos * 0.2);
    ctxEmblema.filter = desenfoque > 0.05 ? `blur(${desenfoque.toFixed(2)}px)` : "none";
    ctxEmblema.drawImage(tmp, 0, 0, bloques, bloques, 0, 0, N, N);
    ctxEmblema.filter = "none";
  }).catch(() => {});
}

const mensajeFinal = document.getElementById("mensajeFinal");
const mensajeFinalTitulo = document.getElementById("mensajeFinalTitulo");
const mensajeFinalTexto = document.getElementById("mensajeFinalTexto");
const btnReiniciar = document.getElementById("btnReiniciar");

function aplicarTraducciones(){
  document.getElementById("linkVolver").textContent = T.volver;
  document.getElementById("menuSubt").textContent = T.menuSubt;
  btnVolverMenu.textContent = T.volverMenu;
  input.placeholder = T.placeholder;
  inputImagen.placeholder = T.placeholder;
  document.getElementById("hClase").textContent = T.colClase;
  document.getElementById("hElemento").textContent = T.colElemento;
  document.getElementById("hDoce").textContent = T.colDoce;
  document.getElementById("hHechizos").textContent = T.colHechizos;
  document.getElementById("hInicial").textContent = T.colInicial;
  document.getElementById("legCorrecto").textContent = T.correcto;
  document.getElementById("legParcial").textContent = T.parcial;
  document.getElementById("legIncorrecto").textContent = T.incorrecto;
  btnReiniciar.textContent = T.reiniciar;
}

function construirMenu(){
  gridModos.innerHTML = "";
  MODOS.forEach(m => {
    const info = T.modos[m.id];
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "modo-card" + (m.disponible ? "" : " proximamente");
    if(!m.disponible) btn.disabled = true;
    btn.innerHTML = `<strong>${info.nombre}</strong><p>${info.desc}</p>` +
      (m.disponible ? "" : `<span class="badge">${T.proximamente}</span>`);
    if(m.disponible){
      btn.addEventListener("click", () => iniciarModo(m));
    }
    gridModos.appendChild(btn);
  });
}

function mostrarVista(nombre){
  vistaMenu.hidden = nombre !== "menu";
  vistaJuego.hidden = nombre !== "juego";
}

function elegirClaseSecreta(excluidoNombre){
  let opciones = CLASES;
  if(excluidoNombre) opciones = CLASES.filter(c => c.nombre !== excluidoNombre);
  return opciones[Math.floor(Math.random() * opciones.length)];
}

function iniciarModo(modoConfig){
  estado.modo = modoConfig;
  estado.claseSecreta = elegirClaseSecreta();
  estado.intentos = [];
  estado.terminado = false;

  mensajeFinal.classList.remove("visible");
  filasGuesses.innerHTML = "";
  chipsIntentos.innerHTML = "";

  const info = T.modos[modoConfig.id];
  tituloModo.textContent = info.nombre;

  if(modoConfig.tipo === "clasico"){
    subtModo.textContent = T.subt;
    uiClasico.hidden = false;
    uiImagen.hidden = true;
    input.disabled = false;
    input.value = "";
  } else {
    subtModo.textContent = T.subtImagen;
    uiClasico.hidden = true;
    uiImagen.hidden = false;
    inputImagen.disabled = false;
    inputImagen.value = "";
    marcoImagen.className = "marco-imagen " + modoConfig.id;
    estado.imgActual = getImagenModo(estado.claseSecreta, modoConfig.id);
    if(modoConfig.id === "emblema"){
      dibujarEmblema(estado.imgActual, 0);
    } else {
      imgSecreta.src = estado.imgActual;
      imgSecreta.alt = "???";
    }
  }

  mostrarVista("juego");
}

btnVolverMenu.addEventListener("click", () => mostrarVista("menu"));

// --- Buscador genérico (autocompletar) ---
function crearBuscador(containerEl, inputEl, listaEl, onSeleccionar){
  function actualizar(){
    const texto = inputEl.value.trim().toLowerCase();
    listaEl.innerHTML = "";
    if(!texto){ listaEl.classList.remove("abierta"); return; }
    const yaUsadas = estado.intentos.map(i => i.nombre);
    const coincidencias = CLASES.filter(c =>
      c.nombre.toLowerCase().includes(texto) && !yaUsadas.includes(c.nombre)
    );
    if(!coincidencias.length){ listaEl.classList.remove("abierta"); return; }
    coincidencias.forEach(c => {
      const div = document.createElement("div");
      div.className = "sugerencia";
      div.textContent = c.nombre;
      div.addEventListener("click", () => onSeleccionar(c.nombre));
      listaEl.appendChild(div);
    });
    listaEl.classList.add("abierta");
  }
  inputEl.addEventListener("input", actualizar);
  inputEl.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){
      const primera = listaEl.querySelector(".sugerencia");
      if(primera) onSeleccionar(primera.textContent);
    }
  });
  document.addEventListener("click", (e) => {
    if(!containerEl.contains(e.target)) listaEl.classList.remove("abierta");
  });
}

// --- Modo Clásico ---
crearBuscador(input.closest(".buscador"), input, listaSugerencias, intentar);

function intentar(nombreElegido){
  if(estado.terminado) return;
  const clase = CLASES.find(c => c.nombre === nombreElegido);
  if(!clase) return;

  estado.intentos.push(clase);
  input.value = "";
  listaSugerencias.classList.remove("abierta");
  renderizarFila(clase);

  if(clase.nombre === estado.claseSecreta.nombre){
    terminarJuego(true);
  } else if(estado.intentos.length >= CLASES.length){
    terminarJuego(false);
  }
}

function compararElementos(guess, secreta){
  const iguales = guess.length === secreta.length && guess.every(e => secreta.includes(e));
  if(iguales) return "correcto";
  const hayInterseccion = guess.some(e => secreta.includes(e));
  return hayInterseccion ? "parcial" : "incorrecto";
}

function traducirElementos(lista){
  return lista.map(e => T.elementos[e] || e).join(", ");
}

function renderizarFila(clase){
  const fila = document.createElement("div");
  fila.className = "fila-guess";

  const estadoElementos = compararElementos(clase.elementos, estado.claseSecreta.elementos);
  const estadoDoce = clase.doce === estado.claseSecreta.doce ? "correcto" : "incorrecto";
  const estadoHechizos = clase.hechizos === estado.claseSecreta.hechizos ? "correcto" : "incorrecto";
  const inicialGuess = clase.nombre[0].toUpperCase();
  const inicialSecreta = estado.claseSecreta.nombre[0].toUpperCase();
  const estadoInicial = inicialGuess === inicialSecreta ? "correcto" : "incorrecto";

  const flechaHechizos = clase.hechizos === estado.claseSecreta.hechizos ? "" :
    (clase.hechizos < estado.claseSecreta.hechizos ? '<span class="flecha">▲</span>' : '<span class="flecha">▼</span>');

  fila.innerHTML = `
    <div class="celda icono"><img src="${clase.img}" alt="${clase.nombre}" loading="lazy"></div>
    <div class="celda nombre">${clase.nombre}</div>
    <div class="celda ${estadoElementos}">${traducirElementos(clase.elementos)}</div>
    <div class="celda ${estadoDoce}">${clase.doce ? T.si : T.no}</div>
    <div class="celda ${estadoHechizos}">${clase.hechizos}${flechaHechizos}</div>
    <div class="celda ${estadoInicial}">${inicialGuess}</div>
  `;
  filasGuesses.prepend(fila);
}

function terminarJuego(gano){
  estado.terminado = true;
  input.disabled = true;
  mensajeFinal.classList.add("visible");
  mensajeFinalTitulo.textContent = gano ? T.ganaste : T.perdiste;
  mensajeFinalTexto.textContent = T.resultado(estado.claseSecreta.nombre, estado.intentos.length);
}

// --- Modos de imagen (Silueta / Emblema) ---
crearBuscador(inputImagen.closest(".buscador"), inputImagen, listaSugerenciasImagen, intentarImagen);

function intentarImagen(nombreElegido){
  if(estado.terminado) return;
  const clase = CLASES.find(c => c.nombre === nombreElegido);
  if(!clase) return;

  estado.intentos.push(clase);
  inputImagen.value = "";
  listaSugerenciasImagen.classList.remove("abierta");

  const chip = document.createElement("span");
  chip.className = "chip-intento";
  chip.textContent = clase.nombre;
  chipsIntentos.appendChild(chip);

  if(clase.nombre === estado.claseSecreta.nombre){
    terminarJuegoImagen(true);
  } else if(estado.intentos.length >= CLASES.length){
    terminarJuegoImagen(false);
  } else if(estado.modo.id === "emblema"){
    dibujarEmblema(estado.imgActual, estado.intentos.length);
  }
}

function terminarJuegoImagen(gano){
  estado.terminado = true;
  inputImagen.disabled = true;
  if(estado.modo.id === "emblema"){
    // Al terminar mostramos el arte limpio y sin recortar, como pago final.
    imgSecreta.src = estado.imgActual;
    imgSecreta.alt = estado.claseSecreta.nombre;
  }
  marcoImagen.classList.add("revelado");
  mensajeFinal.classList.add("visible");
  mensajeFinalTitulo.textContent = gano ? T.ganaste : T.perdiste;
  mensajeFinalTexto.textContent = T.resultado(estado.claseSecreta.nombre, estado.intentos.length);
}

// --- Reiniciar (sirve para cualquier modo activo) ---
btnReiniciar.addEventListener("click", () => {
  if(estado.modo) iniciarModo(estado.modo);
});

// --- Init ---
aplicarTraducciones();
construirMenu();
mostrarVista("menu");
</script>
</body>
</html>
